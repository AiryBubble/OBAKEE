<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="../tool.css">
    <script src="discord.js" defer>
    </script>
  </head>
  <body>
    <a class="back-button" href="../">← ツール一覧</a>
    <p>ユーザー ID を入力して公開プロフィール情報を取得します。Discord API への接続が発生します。</p>
    <label for="user-id">Discord ユーザー ID</label>
    <input id="user-id" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="例: 123456789012345678">
    <button id="lookup" type="button">取得</button>
    <p id="status" role="status">
    </p>
    <section id="profile" hidden>
      <h2 id="username">
      </h2>
      <div id="images">
      </div>
      <p id="banner-color">
      </p>
    </section>
  </body>
</html>
