<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>UIDジェネレーター</title>
    <link rel="stylesheet" href="../tool.css" />
    <style>
      .uid-tool { max-width: 760px; margin: auto; }
      .uid-tool label { display:block; margin: 1rem 0 .3rem; font-weight:700; }
      .uid-tool button { margin-top:1rem; }
      #results { padding:0; list-style:none; }
      #results li { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin:.7rem 0; padding:.8rem; border-radius:.8rem; background:#e8eef5; overflow-wrap:anywhere; }
      #results code { font-family:ui-monospace,monospace; }
    </style>
  </head>
  <body>
    <button class="back-button" type="button" onclick="history.length > 1 ? history.back() : location.assign('../')">← 前のページに戻る</button>
    <main class="uid-tool">
      <h1>IDジェネレーター</h1>
      <p>暗号学的に安全な乱数を使って生成します。</p>
      <label for="id-type">形式</label>
      <select id="id-type"><option value="uuid">UUID v4</option><option value="ulid">ULID</option><option value="nanoid">NanoID (21文字)</option></select>
      <label for="id-count">生成数（1〜100）</label>
      <input id="id-count" type="number" value="1" min="1" max="100" inputmode="numeric">
      <button id="generate" type="button">生成</button>
      <ul id="results" aria-live="polite"></ul>
      <p id="status" role="status"></p>
    </main>
    <script src="uidgen.js" defer></script>
  </body>
</html>
