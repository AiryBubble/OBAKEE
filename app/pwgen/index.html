<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>パスワードジェネレーター</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="tool-page">
    <button class="back-button" type="button" onclick="history.length > 1 ? history.back() : location.assign('../')">← 前のページに戻る</button>
    <h1>パスワードジェネレーター</h1>
    <p>安全なランダムパスワードを生成します。</p>
    <section class="password-panel" aria-label="パスワード設定">
      <label for="length">パスワードの長さ</label>
      <input id="length" type="number" value="16" min="16" max="256" inputmode="numeric" />
      <div class="switch-wrapper">
        <span id="symbols-label">記号を含める</span>
        <label class="switch" aria-labelledby="symbols-label">
          <input id="use-symbols" type="checkbox" checked />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>
      <label for="password-output">生成されたパスワード</label>
      <input id="password-output" type="text" readonly placeholder="ここに生成されます" autocomplete="off" />
      <p class="password-hint">パスワード欄をクリックするとコピーできます。</p>
      <button id="generate-btn" type="button">パスワードを生成</button>
    </section>
    <script>
      const generateBtn = document.getElementById("generate-btn");
      const output = document.getElementById("password-output");
      const lengthInput = document.getElementById("length");
      const useSymbols = document.getElementById("use-symbols");
      const charsBase = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      const charsSymbols = "!@#$%^&*()";

      function secureRandom(max) {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        return array[0] % max;
      }

      function generatePassword(length) {
        const chars = useSymbols.checked ? charsBase + charsSymbols : charsBase;
        let result = "";
        for (let i = 0; i < length; i++) {
          result += chars[secureRandom(chars.length)];
        }
        return result;
      }
      generateBtn.addEventListener("click", () => {
        const length = parseInt(lengthInput.value) || 16;
        output.value = generatePassword(length);
      });
      output.addEventListener("click", () => {
        navigator.clipboard.writeText(output.value);
      });
    </script>
  </body>
</html>
