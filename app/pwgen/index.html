<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>パスワードジェネレーター</title>
    <link rel="stylesheet" href="../tool.css" />
    <style>
      @font-face {
        font-family: "BIZ UDPGothic";
        src: local("BIZ UDPGothic Regular"), local("BIZUDPGothic-Regular"), url(/BIZUDPGothic-Regular.woff2) format("woff2");
        font-style: normal;
        font-display: swap;
      }

      body {
        font-family: "BIZ UDPGothic";
        text-align: center;
        padding: 20px;
      }

      input {
        font-size: 18px;
        padding: 8px;
        margin: 10px;
        width: 300px;
      }

      #generate-btn {
        font-size: 16px;
        padding: 10px 20px;
        background: #57e;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      * {
        color: #240786
      }

      .switch-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 15px 0;
      }

      .switch {
        position: relative;
        width: 50px;
        height: 26px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #ccc;
        border-radius: 26px;
        transition: .3s;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 20px;
        width: 20px;
        left: 3px;
        bottom: 3px;
        background: white;
        border-radius: 50%;
        transition: .3s;
      }

      input:checked+.slider {
        background: #57e;
      }

      input:checked+.slider:before {
        transform: translateX(24px);
      }
    </style>
  </head>
  <body>
    <div>
      <input id="length" type="number" value="16" min="16" max="256" />
      <br />
      <div class="switch-wrapper">
        <span>記号を含める</span>
        <label class="switch">
          <input id="use-symbols" type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>
      <input id="password-output" type="text" readonly placeholder="ここに生成されます" />
      <br />
      <button id="generate-btn">パスワードを生成</button>
    </div>
    <script>
      const generateBtn = document.getElementById("generate-btn");
      const output = document.getElementById("password-output");
      const lengthInput = document.getElementById("length");
      const useSymbols = document.getElementById("use-symbols");
      const charsBase = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      const charsSymbols = "!@#$%^&*()";

      function secureRandom(max) {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        return array[0] % max;
      }

      function generatePassword(length) {
        const chars = useSymbols.checked ? charsBase + charsSymbols : charsBase;
        let result = "";
        for (let i = 0; i < length; i++) {
          result += chars[secureRandom(chars.length)];
        }
        return result;
      }
      generateBtn.addEventListener("click", () => {
        const length = parseInt(lengthInput.value) || 16;
        output.value = generatePassword(length);
      });
      output.addEventListener("click", () => {
        navigator.clipboard.writeText(output.value);
      });
    </script>
  </body>
</html>
