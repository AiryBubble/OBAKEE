<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>QRジェネレーター</title>
    <link rel="stylesheet" href="../tool.css" />
    <script src="jquery.js"></script>
    <script src="qrcode.js"></script>
    <style>
      @font-face {
        font-family: "BIZ UDPGothic";
        src: local("BIZ UDPGothic Regular"), local("BIZUDPGothic-Regular"), url(/BIZUDPGothic-Regular.woff2) format("woff2");
        font-style: normal;
        font-display: swap
      }

      body {
        font-family: "BIZ UDPGothic";
      }

      #qrcode {
        margin-top: 10px;
      }

      button {
        padding: 10px 20px;
        background-color: #57e;
        border: none;
        border-radius: 4px;
        cursor: pointer
      }

      * {
        color: #240786
      }
    </style>
  </head>
  <body>
    <button class="back-button" type="button" onclick="history.length > 1 ? history.back() : location.assign('../')">← 前のページに戻る</button>
    <input type="text" id="qrText" placeholder="テキストまたはURLを入力">
    <button id="generate">QRを生成</button>
    <div id="qrcode"></div>
    <script>
      $(function() {
        var qr;
        $('#generate').click(function() {
          var inputText = $('#qrText').val();
          $('#qrcode').empty();
          qr = new QRCode(document.getElementById("qrcode"), {
            text: inputText,
            width: 256,
            height: 256,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          })
        })
      })
    </script>
</html>
